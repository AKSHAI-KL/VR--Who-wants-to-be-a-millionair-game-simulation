<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Who Wants To Be A Millionaire? — VR Quiz Show</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2308061a'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='bold' font-size='20' fill='%23f2c94c' text-anchor='middle'%3E%3F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene-canvas"></canvas>

    <section id="start-screen" class="overlay">
      <div class="start-panel">
        <div class="start-kicker">STUDIO 5 &middot; LIVE</div>
        <h1 id="game-title" class="start-title">WHO WANTS TO BE A MILLIONAIRE?</h1>
        <p class="start-sub">Step into the contestant's seat. Five questions between you and the jackpot.</p>
        <div class="start-actions">
          <button id="btn-enter-vr-slot" class="btn btn-primary" type="button">ENTER VR</button>
          <button id="btn-desktop-preview" class="btn btn-secondary" type="button">DESKTOP PREVIEW</button>
          <button id="btn-open-editor" class="btn btn-ghost" type="button">GAME EDITOR</button>
        </div>
        <p id="vr-status" class="start-note"></p>
      </div>
    </section>

    <div id="hud" class="hud hidden">
      <div class="hud-top-left">
        <button id="hud-menu" class="hud-btn" type="button" title="Back to menu">&larr; Menu</button>
      </div>
      <div class="hud-top-right">
        <button id="hud-mute" class="hud-btn" type="button" title="Mute/unmute">🔊</button>
        <input id="hud-volume" type="range" min="0" max="1" step="0.05" title="Volume" />
      </div>
      <div id="hud-hint" class="hud-hint">Drag to look around &middot; Click an answer to select it</div>
    </div>

    <section id="editor-overlay" class="overlay hidden">
      <div class="editor-shell">
        <header class="editor-header">
          <h2>Game Editor</h2>
          <button id="editor-close" class="btn btn-ghost small" type="button">Close</button>
        </header>

        <nav class="editor-tabs">
          <button class="editor-tab active" data-tab="settings" type="button">Game Settings</button>
          <button class="editor-tab" data-tab="questions" type="button">Questions</button>
        </nav>

        <div class="editor-body">
          <div id="tab-settings" class="editor-tab-panel active"></div>
          <div id="tab-questions" class="editor-tab-panel"></div>
        </div>

        <footer class="editor-footer">
          <div id="editor-message" class="editor-message"></div>
          <div class="editor-footer-actions">
            <button id="editor-import" class="btn btn-ghost small" type="button">Import JSON</button>
            <button id="editor-export" class="btn btn-ghost small" type="button">Export JSON</button>
            <button id="editor-reset" class="btn btn-danger small" type="button">Reset Game</button>
            <button id="editor-preview" class="btn btn-secondary small" type="button">Preview Game</button>
            <button id="editor-save" class="btn btn-primary small" type="button">Save Changes</button>
          </div>
        </footer>
        <input id="editor-import-input" type="file" accept="application/json" class="hidden" />
      </div>
    </section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
